<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Video Player</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    video {
      width: 100%;
      max-width: 900px;
      background: black;
      border-radius: 8px;
    }

    #status {
      color: #ccc;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1 id="title">My Video Player</h1>

  <video id="player" controls playsinline preload="metadata">
    Your browser does not support video.
  </video>

  <p id="status">ভিডিও লোড হচ্ছে...</p>

  <script>
    const params = new URLSearchParams(location.search);

    // URL থেকে ভিডিওর সরাসরি MP4 ঠিকানা নেওয়া হবে
    const videoURL = params.get("video");
    const title = params.get("title") || "My Video Player";

    document.getElementById("title").textContent = title;
    document.title = title;

    const player = document.getElementById("player");
    const status = document.getElementById("status");

    if (videoURL) {
      try {
        const url = new URL(videoURL);

        if (url.protocol !== "https:") {
          throw new Error("HTTPS ভিডিও URL ব্যবহার করো।");
        }

        player.src = url.href;
        status.textContent = "ভিডিও চালাতে Play চাপো।";

        player.addEventListener("error", () => {
          status.textContent =
            "ভিডিও লোড হয়নি। সরাসরি MP4 URL পরীক্ষা করো।";
        });
      } catch (error) {
        status.textContent = error.message;
      }
    } else {
      status.textContent =
        "URL-এর শেষে ?video= দিয়ে সরাসরি MP4 লিংক যোগ করো।";
    }
  </script>
</body>
</html>
