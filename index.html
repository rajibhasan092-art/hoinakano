<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My 360 Viewer</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 14px;
      text-align: center;
    }

    #panorama {
      width: 100%;
      height: 75vh;
      min-height: 320px;
      background: #222;
    }

    #status {
      padding: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header>
    <h2>My 360 Viewer</h2>
  </header>

  <div id="status">Viewer লোড হচ্ছে...</div>
  <div id="panorama"></div>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>

  <script>
    async function startViewer() {
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const configPath = params.get("config") || "pannellum.json";

      try {
        const configURL = new URL(configPath, location.href);

        // নিরাপত্তার জন্য একই সাইটের JSON গ্রহণ করা হবে
        if (configURL.origin !== location.origin) {
          throw new Error("নিজের GitHub Pages-এর JSON URL ব্যবহার করো।");
        }

        const response = await fetch(configURL);

        if (!response.ok) {
          throw new Error("JSON ফাইল পাওয়া যায়নি।");
        }

        const config = await response.json();

        if (config.panorama) {
          config.panorama = new URL(
            config.panorama,
            configURL
          ).href;
        }

        if (config.scenes) {
          Object.values(config.scenes).forEach(scene => {
            if (scene.panorama) {
              scene.panorama = new URL(
                scene.panorama,
                configURL
              ).href;
            }
          });
        }

        pannellum.viewer("panorama", config);
        status.textContent = "360° Viewer প্রস্তুত";

      } catch (error) {
        status.textContent = "সমস্যা: " + error.message;
      }
    }

    startViewer();
  </script>
</body>
</html>
